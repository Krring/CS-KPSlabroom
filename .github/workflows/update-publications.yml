name: Update publications from ORCID

on:
  schedule:
    - cron: "17 1 * * 1"   # every Monday 08:17 Bangkok time
  workflow_dispatch:         # run by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh data/publications.json
        run: python scripts/update_publications.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/publications.json; then
            echo "No new publications"
            exit 0
          fi
          git config user.name "publications-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/publications.json
          git commit -m "Update publications from ORCID"
          git push
